# ==============================================================================
# Render.com Blueprint Infrastructure as Code (IaC)
# One-click deployment for QueueLess Smart Digital Token System
# ==============================================================================
services:
  - type: web
    name: queueless-smart-tokens
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ADMIN_GMAIL
        value: 24r21a6620@mlrit.ac.in
      - key: ADMIN_PHONE
        value: +918121301736
      - key: GMAIL_USER
        value: 24r21a6620@mlrit.ac.in
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SETUP_KEY
        value: QueueLessAdmin2026!
